<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arrow Functions – Notes</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }
      code {
        background: #f5f5f5;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
      }
    </style>
  </head>

  <body>
    <script>
      /* ==========================================================
      Arrow functions (ES6+)
      -----------------------------------------------
      • Syntax: `const fn = (...params) => expression;`
      • They are *function expressions*, so **not hoisted**.
        (A declaration would be, e.g. `function foo(){}`.)
      • No own `this`, no `arguments` object, and no `prototype`.
      • Cannot be used as constructors (`new fn()` throws).
      • Great for short callbacks or one‑liners.
      ========================================================== */

      // 1️⃣ No‑parameter arrow function
      const sayHello = () => document.writeln('Hello world');
      sayHello(); // ← call it
      document.writeln('<br>'); // just a line break

      // 2️⃣ Single‑parameter arrow function
      const greetByName = (name) => {
        document.writeln(`<br>Hello, my name is ${name}`);
      };
      greetByName('Kamal');

      // 3️⃣ Multi‑parameter arrow function
      const displayName = (firstName, lastName) => {
        document.writeln(`<br>My first name is ${firstName} and last name is ${lastName}`);
      };
      displayName('Amit', 'Kumar');
    </script>
  </body>
</html>
