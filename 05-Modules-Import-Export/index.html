<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Modules</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
      }
      h1 {
        color: #333;
        font-size: 1.5rem;
      }
      #result {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #eef2ff;
        border-radius: 8px;
        border-left: 4px solid #4f46e5;
      }
      p {
        margin: 0.5rem 0;
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ES Modules Demo</h1>
      <p>
        The logic below is separated into <code>math-utils.js</code> and imported into
        <code>main.js</code>.
      </p>
      <div id="result">
        <!-- Results will be injected here -->
        Loading calculations...
      </div>
    </div>

    <!-- IMPORTANT: type="module" is required for imports to work -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
