<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Even/Odd Checker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 50px;
      }
      label,
      input,
      button {
        margin: 8px 0;
      }
      input {
        padding: 6px 10px;
        width: 200px;
        font-size: 1rem;
      }
      button {
        padding: 6px 12px;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <label for="enterValue1">Enter a number:</label>
    <input type="number" id="enterValue1" placeholder="e.g., 42" />
    <button id="submitButton">Check</button>
  </body>
  <script src="script.js"></script>
</html>
